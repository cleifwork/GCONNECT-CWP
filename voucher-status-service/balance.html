<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071322"><title>GConnect — Check WiFi Time</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px 20px;font:16px/1.5 system-ui,sans-serif;background:#f5f8ff;color:#10213d}main{max-width:420px;margin:8vh auto}h1{font-size:27px;letter-spacing:-.03em;margin:0}header{text-align:center;margin-bottom:24px}header p{color:#61738e}section{padding:24px;border:1px solid #bed0e7;border-radius:22px;background:white}label{display:block;margin-bottom:8px}input,button{font:inherit;width:100%;border-radius:12px;padding:14px}input{border:1px solid #9bb3d3;background:#f5f9ff;color:inherit;font-size:16px}input:focus{outline:3px solid #1465d833;border-color:#1465d8}button{border:0;margin-top:14px;background:#1465d8;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#result{text-align:center;margin-top:22px}#duration{display:block;font-size:clamp(22px,6vw,38px);font-weight:800;overflow-wrap:break-word}#badge:not(:empty){display:inline-block;padding:5px 12px;border-radius:99px;background:#dcecff;color:#165a97;font-size:13px}#badge[data-state=unused]{background:#def4e7;color:#126338}#badge[data-state=expired]{background:#fbe7e7;color:#a53030}.note{text-align:center;font-size:13px;color:#61738e;margin-top:22px}@media(prefers-color-scheme:dark){body{background:#071322;color:#e7efff}section{background:#0c1e34;border-color:#365372}input{background:#102a47;border-color:#466381}header p,.note{color:#aebed4}#badge:not(:empty){background:#163b58;color:#83caff}#badge[data-state=unused]{background:#173c2c;color:#86e3ad}#badge[data-state=expired]{background:#48272e;color:#ffacac}}
</style></head><body><main><header><h1>GCONNECT WIFI</h1><p>Check your remaining WiFi time</p></header><section><form id="form"><label for="code">Voucher code</label><input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter voucher code" required maxlength="64"><button id="check">Check balance</button></form><div id="result" role="status" aria-live="polite"><strong id="duration"></strong><span id="badge"></span><p id="message"></p></div></section><p class="note">Bookmark this page to check again after connecting.<br>Checking a balance does not activate your voucher.</p></main><script>
function formatRemainingTime(seconds) {
  var totalMinutes=Math.floor(seconds/60);
  if(seconds>0&&totalMinutes===0)return 'Less than 1 min';
  var days=Math.floor(totalMinutes/1440), hours=Math.floor(totalMinutes%1440/60), minutes=totalMinutes%60, parts=[];
  if(days)parts.push(days+' '+(days===1?'day':'days'));
  if(hours)parts.push(hours+'h');
  if(minutes)parts.push(minutes+' min');
  return parts.length?parts.join(' '):'0 min';
}

var form=document.getElementById('form'),button=document.getElementById('check'),duration=document.getElementById('duration'),badge=document.getElementById('badge'),message=document.getElementById('message');
form.addEventListener('submit',async function(e){e.preventDefault();button.disabled=true;duration.textContent='';badge.textContent='';message.textContent='Checking…';try{var r=await fetch('/voucher-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value.trim()}),signal:AbortSignal.timeout(60000)}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to check balance.');if(!d.found){message.textContent='Voucher not found.';return;}badge.dataset.state=d.status;badge.textContent=d.status==='unused'?'Not Activated':d.status==='active'?'Active':d.status==='expired'?'Expired':'Status unavailable';if(d.deviceSpecific){message.textContent='This plan has a separate balance for each device.';return;}if(d.remainingSeconds===null){message.textContent='Remaining time is unavailable.';return;}duration.textContent=formatRemainingTime(d.remainingSeconds);message.textContent=d.status==='unused'?'Available time. Your timer starts when you connect.':'Remaining WiFi time';}catch(error){message.textContent=error.name==='TimeoutError'?'The check timed out. Please try again.':'Unable to check: '+error.message;}finally{button.disabled=false;}});
</script></body></html>
