Sl+dxuvNB1wRmzESckLJ0KV1HKc8aM0bq55ucRkcsFiRjLkLv3qVpaOCaCxecxctzEEc3+vtJDQWmGgxd7W/WuicXFPwDUlYhO1SHnsAAAAAASUVORK5CYII=");}#clear-code{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;margin:0;padding:0;border:0;border-radius:50%;background:transparent;color:#61738e;font:26px/1 system-ui;cursor:pointer}#clear-code[hidden]{display:none}#clear-code:focus-visible{outline:2px solid #1465d8;outline-offset:-3px}@media(prefers-color-scheme:dark){#clear-code{color:#aebed4}}</style></head><body><main><header><h1>GCONNECT WIFI</h1><p>Check your remaining WiFi time</p></header><section><form id="form"><label for="code">Voucher code</label><div class="code-field"><span class="voucher-icon" aria-hidden="true"></span><input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter voucher code" required maxlength="64"><button type="button" id="clear-code" aria-label="Clear voucher code" hidden>×</button></div><button id="check" type="submit">Check balance</button></form><div id="result" role="status" aria-live="polite"><strong id="duration"></strong><span id="badge"></span><p id="message"></p></div></section><p class="note">Bookmark this page to check again after connecting.<br>Checking a balance does not activate your voucher.</p></main><script>
function attachVoucherClear(input, button) {
  function update() { button.hidden=input.value.length===0; }
  input.addEventListener('input',update);
  input.addEventListener('change',update);
  input.addEventListener('focus',update);
  button.addEventListener('pointerdown',function(event){event.preventDefault();});
  button.addEventListener('click',function(){
    input.value='';input.focus();
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.dispatchEvent(new Event('change',{bubbles:true}));
  });
  update();
}
attachVoucherClear(document.getElementById('code'),document.getElementById('clear-code'));

function formatRemainingTime(seconds) {
  var totalMinutes=Math.floor(seconds/60);
  if(seconds>0&&totalMinutes===0)return 'Less than 1 min';
  var days=Math.floor(totalMinutes/1440), hours=Math.floor(totalMinutes%1440/60), minutes=totalMinutes%60, parts=[];
  if(days)parts.push(days+' '+(days===1?'day':'days'));
  if(hours)parts.push(hours+'h');
  if(minutes)parts.push(minutes+' min');
  return parts.length?parts.join(' '):'0 min';
}

var form=document.getElementById('form'),button=document.getElementById('check'),duration=document.getElementById('duration'),badge=document.getElementById('badge'),message=document.getElementById('message');
form.addEventListener('submit',async function(e){e.preventDefault();button.disabled=true;duration.textContent='';badge.textContent='';message.textContent='Checking…';try{var r=await fetch('/voucher-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value.trim()}),signal:AbortSignal.timeout(60000)}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to check balance.');if(!d.found){message.textContent='Voucher not found.';return;}badge.dataset.state=d.status;badge.textContent=d.status==='unused'?'Unused':d.status==='active'?'In-use':d.status==='expired'?'Expired':'Status unavailable';if(d.deviceSpecific){message.textContent='This plan has a separate balance for each device.';return;}if(d.remainingSeconds===null){message.textContent='Remaining time is unavailable.';return;}duration.textContent=formatRemainingTime(d.remainingSeconds);message.textContent=d.status==='unused'?'Available time. Your timer starts when you connect.':'Remaining WiFi time';}catch(error){message.textContent=error.name==='TimeoutError'?'The check timed out. Please try again.':'Unable to check: '+error.message;}finally{button.disabled=false;}});
</script></body></html>
